spring.application.name=giftntintiliapi

spring.datasource.url=jdbc:h2:mem:envirodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only demo credentials. Override these environment variables outside local development.
enviro365.demo.john.password=${ENVIRO365_DEMO_JOHN_PASSWORD:John123!}
enviro365.demo.mary.password=${ENVIRO365_DEMO_MARY_PASSWORD:Mary123!}
